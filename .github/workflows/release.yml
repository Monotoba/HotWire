name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        body: |
          Wire Temperature Calculator Release
          
          ## Changes
          See [CHANGELOG.md](CHANGELOG.md) for detailed changes.
          
          ## Installation
          
          ### Windows
          Download `WireTemperatureCalculator-Windows.zip` and run `install.bat`
          
          ### macOS
          Download `WireTemperatureCalculator-macOS.dmg` and install
          
          ### Linux
          Download `WireTemperatureCalculator-Linux.AppImage` and make executable
          
          ### Python Package
          ```bash
          pip install wire-temperature-calculator==${{ github.ref_name }}
          ```

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "WireTemperatureCalculator" --distpath dist/windows src/wire_temp_calc/main.py
        copy install.bat dist/windows\
        copy activate_and_run.bat dist/windows\
        copy uninstall.bat dist/windows\
    
    - name: Create Windows package
      run: |
        cd dist/windows
        7z a ../../WireTemperatureCalculator-Windows.zip *
    
    - name: Upload Windows release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./WireTemperatureCalculator-Windows.zip
        asset_name: WireTemperatureCalculator-Windows.zip
        asset_content_type: application/zip

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "WireTemperatureCalculator" --distpath dist/macos src/wire_temp_calc/main.py
        cp install.sh dist/macos/
        cp activate_and_run.sh dist/macos/
        chmod +x dist/macos/install.sh
        chmod +x dist/macos/activate_and_run.sh
    
    - name: Create macOS app bundle
      run: |
        cd dist/macos
        mkdir -p WireTemperatureCalculator.app/Contents/MacOS
        mkdir -p WireTemperatureCalculator.app/Contents/Resources
        cp WireTemperatureCalculator WireTemperatureCalculator.app/Contents/MacOS/
        
        cat > WireTemperatureCalculator.app/Contents/Info.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleName</key>
            <string>Wire Temperature Calculator</string>
            <key>CFBundleDisplayName</key>
            <string>Wire Temperature Calculator</string>
            <key>CFBundleIdentifier</key>
            <string>com.wiretempcalc.app</string>
            <key>CFBundleVersion</key>
            <string>2.0.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>WireTemperatureCalculator</string>
        </dict>
        </plist>
        EOF
    
    - name: Create macOS DMG
      run: |
        cd dist/macos
        hdiutil create -volname "WireTemperatureCalculator" -srcfolder . -ov -format UDZO ../../WireTemperatureCalculator-macOS.dmg
    
    - name: Upload macOS release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./WireTemperatureCalculator-macOS.dmg
        asset_name: WireTemperatureCalculator-macOS.dmg
        asset_content_type: application/x-apple-diskimage

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "WireTemperatureCalculator" --distpath dist/linux src/wire_temp_calc/main.py
        cp install.sh dist/linux/
        cp activate_and_run.sh dist/linux/
        chmod +x dist/linux/install.sh
        chmod +x dist/linux/activate_and_run.sh
    
    - name: Create AppImage
      run: |
        cd dist/linux
        
        # Create AppImage structure
        mkdir -p WireTemperatureCalculator.AppDir/usr/bin
        mkdir -p WireTemperatureCalculator.AppDir/usr/share/applications
        mkdir -p WireTemperatureCalculator.AppDir/usr/share/icons/hicolor/256x256/apps
        
        # Copy executable and scripts
        cp WireTemperatureCalculator WireTemperatureCalculator.AppDir/usr/bin/
        cp install.sh WireTemperatureCalculator.AppDir/usr/bin/
        cp activate_and_run.sh WireTemperatureCalculator.AppDir/usr/bin/
        
        # Create desktop file
        cat > WireTemperatureCalculator.AppDir/usr/share/applications/wire-temperature-calculator.desktop << EOF
        [Desktop Entry]
        Name=Wire Temperature Calculator
        Comment=Professional wire temperature and foam cutting calculator
        Exec=WireTemperatureCalculator
        Icon=wire-temperature-calculator
        Terminal=false
        Type=Application
        Categories=Science;Education;
        EOF
        
        # Download appimagetool
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage
        
        # Create AppImage
        ./appimagetool-x86_64.AppImage WireTemperatureCalculator.AppDir
        mv Wire_Temperature_Calculator-x86_64.AppImage ../../WireTemperatureCalculator-Linux.AppImage
    
    - name: Upload Linux release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./WireTemperatureCalculator-Linux.AppImage
        asset_name: WireTemperatureCalculator-Linux.AppImage
        asset_content_type: application/x-executable

  publish-pypi:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel
    
    - name: Build package
      run: |
        python -m build
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip_existing: true